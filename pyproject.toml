[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "Local CLI for capturing, promoting, and querying a personal LLM wiki shared by multiple AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pel = "pelib.cli:main"

[tool.setuptools]
packages = ["pelib", "pelib.adapters"]
